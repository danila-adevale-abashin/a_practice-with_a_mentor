[project]
name = "a-practice-with-a-mentor"
version = "0.1.0"
description = ""
authors = [
    {name = "Абашин Данила Евгеньевич", email = "daniel.abashin@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ===== FLAKE8 =====
[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", ".mypy_cache", ".pytest_cache", "build", "dist", "htmlcov"]
per-file-ignores = ["__init__.py:F401"]

# ===== BLACK =====
[tool.black]
line-length = 119
target-version = ["py314"]
exclude = '''
(
  /(
      \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
    | htmlcov
  )/
)
'''

# ===== ISORT =====
[tool.isort]
line_length = 119
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ===== MYPY =====
[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = '\.venv/'
explicit_package_bases = true
[dependency-groups]
dev = [
    "flake8-pyproject (>=1.2.4,<2.0.0)"
]